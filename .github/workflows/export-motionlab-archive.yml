name: Export MotionLab Archive

on:
  pull_request:
    paths:
      - ".github/workflows/export-motionlab-archive.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact archive head
        uses: actions/checkout@v4

      - name: Build archive
        shell: bash
        run: |
          mkdir -p export/MotionLab_pre_ProjectHub_2026-09-23
          rsync -a --exclude '.git' --exclude 'export' ./ export/MotionLab_pre_ProjectHub_2026-09-23/
          printf '%s\n' "Archived source commit: 85e64bd1dd67148893290c5862a1187567b7e54e" > export/MotionLab_pre_ProjectHub_2026-09-23/ARCHIVE_SOURCE_COMMIT.txt

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: MotionLab_pre_ProjectHub_2026-09-23
          path: export/MotionLab_pre_ProjectHub_2026-09-23
          if-no-files-found: error
          retention-days: 7
